721579523116], "type": "Point"}, "id": "350", "properties": {"%IR": "22.71%", "Categoria": "Categoría 2 [15%-36%]", "IR": 0.2271, "__folium_color": "orange", "km": "23+602.24", "Tramo": "HUIMILPAN - CERRO DEL TAMBOR 10", "Archivo_Origen": "mapa_DCVG_HUIMILPAN - CERRO DEL TAMBOR 10.html"}, "type": "Feature"}, {"bbox": [-100.43470408361978, 20.63138997499547, -100.43470408361978, 20.63138997499547], "geometry": {"coordinates": [-100.43470408361978, 20.63138997499547], "type": "Point"}, "id": "352", "properties": {"%IR": "17.23%", "Categoria": "Categoría 2 [15%-36%]", "IR": 0.1723, "__folium_color": "orange", "km": "23+918.26", "Tramo": "HUIMILPAN - CERRO DEL TAMBOR 10", "Archivo_Origen": "mapa_DCVG_HUIMILPAN - CERRO DEL TAMBOR 10.html"}, "type": "Feature"}, {"bbox": [-100.41735346247923, 20.606183263632886, -100.41735346247923, 20.606183263632886], "geometry": {"coordinates": [-100.41735346247923, 20.606183263632886], "type": "Point"}, "id": "10", "properties": {"%IR": "30.39%", "Categoria": "Categoría 2 [15%-36%]", "IR": 0.3039, "__folium_color": "orange", "km": "0+054.62", "Tramo": "NESTLÉ", "Archivo_Origen": "mapa_DCVG_NESTLÉ.html"}, "type": "Feature"}]};
        var cat3Data = {"type": "FeatureCollection", "features": []};

        var tramoLayersMap = {};

        // 4. Layer: Pipelines (Trazos de ductos delgados en color negro)
        var linesLayer = L.geoJson(linesData, {
            style: function(feature) {
                return {
                    color: "#000000",
                    weight: 2.0,
                    opacity: 0.95,
                    lineCap: "round",
                    lineJoin: "round"
                };
            },
            onEachFeature: function(feature, layer) {
                var p = feature.properties || {};
                var nombre = p.Nombre || p.NOMBRE || 'Tramo';
                var length = p.Length_m || p.LENGTH_GEO || '-';
                if (typeof length === 'number') {
                    length = length.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' m';
                }

                tramoLayersMap[nombre] = layer;

                // Tooltip
                layer.bindTooltip(`<strong>${nombre}</strong><br><small>Longitud: ${length}</small>`, {
                    sticky: true,
                    className: "foliumtooltip"
                });

                // Popup
                var popupContent = `
                    <div class="popup-header" style="background: linear-gradient(135deg, #1e293b, #0f172a);">
                        <i class="fa-solid fa-route me-2"></i> Tramo / Ducto
                    </div>
                    <div class="popup-body">
                        <table class="custom-popup-table">
                            <tr><th>Nombre</th><td><strong>${nombre}</strong></td></tr>
                            <tr><th>Longitud</th><td>${length}</td></tr>
                            <tr><th>Archivo Origen</th><td><small>${p.Archivo_Origen || '-'}</small></td></tr>
                        </table>
                    </div>
                `;
                layer.bindPopup(popupContent);

                layer.on({
                    mouseover: function(e) {
                        e.target.setStyle({ weight: 4.0, color: '#334155', opacity: 1 });
                    },
                    mouseout: function(e) {
                        linesLayer.resetStyle(e.target);
                    }
                });
            }
        }).addTo(map);

        // Helper function for Point Layers (sin contorno blanco y tamaño más pequeño: radio 3px)
        function createPointLayer(geojsonData, defaultColor, categoryName, badgeClass, headerBg) {
            return L.geoJson(geojsonData, {
                pointToLayer: function(feature, latlng) {
                    return L.circleMarker(latlng, {
                        radius: 3,
                        fillColor: defaultColor,
                        stroke: false,
                        fillOpacity: 0.9
                    });
                },
                onEachFeature: function(feature, layer) {
                    var p = feature.properties || {};
                    var km = p.km || '-';
                    var pctIR = p["%IR"] || (p.IR ? (p.IR * 100).toFixed(2) + '%' : '-');
                    var tramo = p.Tramo || p.Nombre || '-';
                    var cat = p.Categoria || categoryName;

                    // Tooltip
                    layer.bindTooltip(`
                        <table>
                            <tr><th>Tramo:</th><td>${tramo}</td></tr>
                            <tr><th>km:</th><td>${km}</td></tr>
                            <tr><th>%IR:</th><td>${pctIR}</td></tr>
                            <tr><th>Cat:</th><td>${cat}</td></tr>
                        </table>
                    `, {
                        sticky: true,
                        className: "foliumtooltip"
                    });

                    // Popup
                    var popupContent = `
                        <div class="popup-header" style="background: ${headerBg};">
                            <i class="fa-solid fa-circle-dot me-2"></i> ${cat}
                        </div>
                        <div class="popup-body">
                            <table class="custom-popup-table">
                                <tr><th>Tramo</th><td><strong>${tramo}</strong></td></tr>
                                <tr><th>Progresiva (km)</th><td>${km}</td></tr>
                                <tr><th>% IR</th><td><span class="badge ${badgeClass}">${pctIR}</span></td></tr>
                                <tr><th>Categoría</th><td>${cat}</td></tr>
                                <tr><th>Archivo Origen</th><td><small>${p.Archivo_Origen || '-'}</small></td></tr>
                            </table>
                        </div>
                    `;
                    layer.bindPopup(popupContent);

                    layer.on({
                        mouseover: function(e) {
                            e.target.setRadius(5.5);
                            e.target.setStyle({ fillOpacity: 1 });
                        },
                        mouseout: function(e) {
                            e.target.setRadius(3);
                            e.target.setStyle({ fillOpacity: 0.9 });
                        }
                    });
                }
            });
        }

        // 5. Point Layers by Category
        var cat1Layer = createPointLayer(cat1Data, "#16a34a", "Categoría 1 [0%-15%]", "bg-success", "linear-gradient(135deg, #16a34a, #15803d)").addTo(map);
        var cat2Layer = createPointLayer(cat2Data, "#ea580c", "Categoría 2 [15%-36%]", "bg-warning text-dark", "linear-gradient(135deg, #ea580c, #c2410c)").addTo(map);
        var cat3Layer = createPointLayer(cat3Data, "#dc2626", "Categoría 3 [36%-70%]", "bg-danger", "linear-gradient(135deg, #dc2626, #b91c1c)");

        // 6. Layer Control
        var overlayMaps = {
            "<span style='color:#0f172a; font-weight:600;'><i class='fa-solid fa-route'></i> Trazos de Tubería (23 Tramos)</span>": linesLayer,
            "<span style='color:#16a34a; font-weight:600;'><i class='fa-solid fa-circle'></i> Categoría 1 [0%-15%] (526 pts)</span>": cat1Layer,
            "<span style='color:#ea580c; font-weight:600;'><i class='fa-solid fa-circle'></i> Categoría 2 [15%-36%] (42 pts)</span>": cat2Layer
        };
        
        if (0 > 0) {
            overlayMaps["<span style='color:#dc2626; font-weight:600;'><i class='fa-solid fa-circle'></i> Categoría 3 [36%-70%] (0 pts)</span>"] = cat3Layer;
            cat3Layer.addTo(map);
        }

        L.control.layers(baseMaps, overlayMaps, {
            position: 'topright',
            collapsed: false,
            autoZIndex: true
        }).addTo(map);

        // 7. Legend Control (Bottom Left)
        var legend = L.control({ position: 'bottomleft' });
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend-card');
            div.innerHTML = `
                <h6><i class="fa-solid fa-layer-group me-1"></i> Simbología DCVG</h6>
                <div class="legend-item">
                    <span class="legend-line" style="background-color: #000000; height: 2px;"></span>
                    <span>Trazos de Tubería (23)</span>
                </div>
                <div class="legend-item">
                    <span class="legend-symbol" style="background-color: #16a34a;"></span>
                    <span>Categoría 1 [0%-15%] (526)</span>
                </div>
                <div class="legend-item">
                    <span class="legend-symbol" style="background-color: #ea580c;"></span>
                    <span>Categoría 2 [15%-36%] (42)</span>
                </div>
                ${0 > 0 ? `
                <div class="legend-item">
                    <span class="legend-symbol" style="background-color: #dc2626;"></span>
                    <span>Categoría 3 [36%-70%] (0)</span>
                </div>` : ''}
            `;
            return div;
        };
        legend.addTo(map);

        // 8. Auto Fit Bounds to show all features
        var allBounds = L.featureGroup([linesLayer, cat1Layer, cat2Layer]);
        if (0 > 0) {
            allBounds.addLayer(cat3Layer);
        }
        map.fitBounds(allBounds.getBounds(), { padding: [35, 35] });

        // 9. Populate Tramo Selector
        var selector = document.getElementById('tramoSelector');
        var tramoNames = Object.keys(tramoLayersMap).sort();
        tramoNames.forEach(function(name) {
            var opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            selector.appendChild(opt);
        });

        selector.addEventListener('change', function(e) {
            var selected = e.target.value;
            if (selected && tramoLayersMap[selected]) {
                var layer = tramoLayersMap[selected];
                map.fitBounds(layer.getBounds(), { padding: [60, 60], maxZoom: 17 });
                layer.openPopup();
            } else {
                map.fitBounds(allBounds.getBounds(), { padding: [35, 35] });
            }
        });

    </script>
